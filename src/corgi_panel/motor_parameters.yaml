# Motor Parameter Configuration
# All parameters data for motor configuration

parameters:
  # Group: System
  - Variable: CAN_ID
    Address: 1
    Writeable: 1
    Init: 1
    Min: 0
    Max: 127
    Group: System
    Unit: ""
